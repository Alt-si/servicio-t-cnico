{% extends "base.html" %}
{% block cuerpo %}
<div class="card hoja">
  <div class="row no-print"><a class="btn" href="{{ url_for('facturacion') }}">← Comprobantes</a>
    {% if puede_anular %}<button class="btn bad der" id="anular">Anular con nota de crédito</button>{% endif %}</div>
  {% include "facturacion/_enviar.html" %}
  {% include "facturacion/_factura.html" %}
</div>
{% endblock %}
{% block js %}<script>
document.getElementById('anular')?.addEventListener('click', async () => {
  if (!await confirmar('Se emite una nota de crédito por el total y la factura queda anulada. Esto no se puede deshacer. ¿Continuar?')) return;
  const b = document.getElementById('anular'); b.disabled = true; b.textContent = 'Emitiendo nota de crédito…';
  const j = await api('/api/facturacion/{{ f.id }}/anular', {});
  if (j.ok) location = '/facturacion/comprobante/' + j.id; else { b.disabled = false; b.textContent = 'Anular con nota de crédito'; aviso(j.error); }
});
</script>{% endblock %}
