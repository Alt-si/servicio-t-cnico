{% extends "base.html" %}
{% block cuerpo %}
<div class="card login">
  <h1>Ingresar</h1>
  {% if msg %}<div class="msg error">{{ msg }}</div>{% endif %}
  <form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Mail</label><input type="email" name="email" required autofocus autocomplete="username">
    <label>Clave</label><input type="password" name="clave" required autocomplete="current-password">
    <p><button class="btn pri" style="width:100%">Entrar</button></p>
  </form>
</div>
{% endblock %}
